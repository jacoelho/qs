version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - iface
    - dupl
    - dogsled
    - forbidigo
    - funlen
    - gocritic
    - goconst
    - gocognit
    - cyclop
    - nestif
    - maintidx
    - unparam
    - errorlint
    - nilerr
    - nilnil
    - nilnesserr
    - wastedassign
    - forcetypeassert
    - bodyclose
    - nolintlint
    - exhaustive
    - gosec
    - ireturn
    - interfacebloat
    - copyloopvar
    - predeclared
    - nakedret
    - contextcheck
    - reassign
    - makezero
    - modernize
    - noctx
    - recvcheck
    - unconvert
    - asciicheck
    - bidichk
    - depguard
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - gocheckcompilerdirectives
    - gochecknoinits
    - godoclint
    - gomoddirectives
    - goprintffuncname
    - inamedparam
    - intrange
    - iotamixing
    - mirror
    - misspell
    - musttag
    - nosprintfhostport
    - testableexamples
    - thelper
    - tparallel
    - usestdlibvars
    - usetesting

  settings:
    gomoddirectives:
      # The integration module tests the local qs checkout.
      replace-local: true

    govet:
      # Includes fieldalignment; test structs are excluded below.
      enable-all: true

    errcheck:
      check-blank: true
      check-type-assertions: true

    exhaustive:
      default-signifies-exhaustive: true

    nilnil:
      detect-opposite: true

    reassign:
      patterns:
        - ".*"

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: []

    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
            - "!**/integration/**"
          allow:
            - $gostd
            - github.com/jacoelho/qs$
            - github.com/jacoelho/qs/internal/postgrescorpus$
            - github.com/jacoelho/qs/projection$

        integration:
          list-mode: strict
          files:
            - "**/integration/**"
          allow:
            - $gostd
            - github.com/jacoelho/qs$
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/

    dupword:
      # SQL grammar can repeat keywords, e.g. ON EMPTY EMPTY OBJECT.
      comments-only: true

    revive:
      enable-default-rules: true
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-lines
        - name: error-return
        - name: error-strings
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: if-return
        - name: increment-decrement
        - name: modifies-value-receiver
        - name: package-comments
        - name: redefines-builtin-id
        - name: superfluous-else
          arguments:
            - preserve-scope
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unexported-return
        - name: unnecessary-if
        - name: var-declaration
        - name: var-naming

    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - ^github\.com/jacoelho/qs\.(Statement|Rowset)$

    dupl:
      threshold: 120

    dogsled:
      max-blank-identifiers: 1

    gocognit:
      min-complexity: 50

    cyclop:
      max-complexity: 35

    gocritic:
      enabled-checks:
        - boolExprSimplify
        - commentedOutImport
        - deferUnlambda
        - dupImport
        - emptyFallthrough
        - emptyStringTest
        - exposedSyncMutex
        - hexLiteral
        - httpNoBody
        - methodExprCall
        - octalLiteral
        - preferFilepathJoin
        - redundantSprint
        - regexpSimplify
        - stringConcatSimplify
        - stringsCompare
        - timeExprSimplify
        - typeAssertChain
        - typeUnparen
        - unlabelStmt
        - unnecessaryBlock
        - whyNoLint
        - yodaStyleExpr

    funlen:
      lines: 120
      statements: 70
      ignore-comments: true

    nestif:
      min-complexity: 15

    maintidx:
      under: 25

  exclusions:
    paths:
      # Generated corpus builders are verified by tests and their generator.
      - '(^|/)[^/]*_generated_test\.go$'
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - goconst
          - funlen
          - nestif
          - dupl
          - maintidx
          - dogsled
          - errcheck
          - gosec
      - path: _test\.go
        text: "unused-parameter:"
        linters:
          - revive
      - path: _test\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: _test\.go
        linters:
          - govet
        text: "shadow:"

issues:
  # Keep alignment findings visible when other linters flag the same line.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
